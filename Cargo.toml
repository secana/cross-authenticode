[package]
name = "cross-authenticode"
version = "1.0.1"
edition = "2024"
description = "Cross-platform implementation of Authenticode signature verification"
license = "MIT OR Apache-2.0"
repository = "https://github.com/secana/cross-authenticode"
readme = "README.md"
keywords = ["authenticode", "certificate", "pefile"]
authors = ["Stefan Hausotte"]
documentation = "https://docs.rs/cross-authenticode"

[dependencies]
cms = "0.2"
thiserror = "2.0"
object = "0.36"
sha1 = "0.10"
sha2 = "0.10"
der = "0.7"
x509-cert = "0.2"
